            background: var(--bg);

            align-items: center;

        .container {
            width: 90%;

            padding: 20px;
        }
        .upload-area {
            border: 2px dashed var(--primary);

            padding: 40px 20px;

        }
        #preview {
            width: 100%;
            border-radius: 10px;

            margin-top: 20px;
        }
        .btn {

            border-radius: 10px;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
            display: none;
        }
        input[type="file"] { display: none; }
    </style>
</head>
