<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Smart Remover</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --input-bg: #0b1120;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .upload-area {
            border: 2px dashed #475569;
            border-radius: 14px;
            padding: 36px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(15, 23, 42, 0.4);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .upload-icon {
            font-size: 44px;
            margin-bottom: 12px;
            display: block;
        }

        .upload-text {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 14px;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: #ffffff;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        input[type="file"] {
            display: none;
        }

        #preview-section {
            margin-top: 20px;
            display: none;
            text-align: left;
        }

        #preview-img {
            width: 100%;
            max-height: 320px;
            border-radius: 12px;
            object-fit: contain;
            background: var(--input-bg);
            border: 1px solid var(--border);
            display: block;
            margin-bottom: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .prompt-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .prompt-input:focus {
            border-color: var(--primary);
        }

        .prompt-input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }

        .btn-change {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            margin-top: 10px;
            width: 100%;
        }

        .btn-change:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Smart Remover</h1>
    <p class="subtitle">Удаление нежелательных объектов с изображений по описанию</p>

    <div class="upload-area" id="drop-zone">
        <span class="upload-icon">📁</span>
        <div class="upload-text">Перетащите фото сюда или нажмите кнопку</div>
        <label for="file-input" class="btn">Выбрать фото</label>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <div id="preview-section">
        <img id="preview-img" alt="Предпросмотр">

        <div class="input-group">
            <label for="prompt-input">Что именно нужно удалить?</label>
            <input 
                type="text" 
                id="prompt-input" 
                class="prompt-input" 
                placeholder="Например: человек на фоне, провод, водяной знак"
                autocomplete="off"
            >
        </div>

        <button class="btn btn-submit" id="process-btn">Удалить с фото</button>
        <button class="btn btn-change" id="change-btn">Выбрать другое фото</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const previewSection = document.getElementById('preview-section');
    const previewImg = document.getElementById('preview-img');
    const promptInput = document.getElementById('prompt-input');
    const processBtn = document.getElementById('process-btn');
    const changeBtn = document.getElementById('change-btn');

    let currentFile = null;

    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) {
            alert('Пожалуйста, выберите файл изображения (PNG, JPG, WEBP).');
            return;
        }

        currentFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImg.src = e.target.result;
            dropZone.style.display = 'none';
            previewSection.style.display = 'block';
            promptInput.focus();
        };
        reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    changeBtn.addEventListener('click', () => {
        fileInput.value = '';
        currentFile = null;
        promptInput.value = '';
        previewSection.style.display = 'none';
        dropZone.style.display = 'block';
    });

    processBtn.addEventListener('click', () => {
        const query = promptInput.value.trim();

        if (!query) {
            alert('Пожалуйста, укажите объект, который требуется удалить.');
            promptInput.focus();
            return;
        }

        alert(`Файл "${currentFile.name}" готов к обработке.\nОбъект: "${query}"`);
    });
</script>

</body>
</html>
